name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      whatsapp_service: ${{ steps.filter.outputs.whatsapp_service }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
            whatsapp_service:
              - 'whatsapp_service/**'

  deploy-api:
    name: Build & Deploy API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ngo-sandeep-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ngo-sandeep-api:${{ github.sha }}

      - name: Trigger Render deploy
        env:
          RENDER_API_DEPLOY_HOOK_API: ${{ secrets.RENDER_API_DEPLOY_HOOK_API }}
        run: |
          response=$(curl --silent --fail-with-body -X POST "$RENDER_API_DEPLOY_HOOK_API")
          echo "$response"

  deploy-whatsapp:
    name: Build & Deploy WhatsApp Service
    needs: changes
    if: needs.changes.outputs.whatsapp_service == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push WhatsApp Service image
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp_service
          file: ./whatsapp_service/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ngo-sandeep-whatsapp-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ngo-sandeep-whatsapp-service:${{ github.sha }}

      - name: Trigger Render deploy
        env:
          RENDER_API_DEPLOY_HOOK_WHATSAPP_SERVICE: ${{ secrets.RENDER_API_DEPLOY_HOOK_WHATSAPP_SERVICE }}
        run: |
          response=$(curl --silent --fail-with-body -X POST "$RENDER_API_DEPLOY_HOOK_WHATSAPP_SERVICE")
          echo "$response"

